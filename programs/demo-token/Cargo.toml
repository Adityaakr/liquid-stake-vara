[package]
name = "demo-token"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Package allowing to build WASM binary for the program and IDL file for it"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
demo-token-app.workspace = true
sails-rs.workspace = true

[dev-dependencies]
demo-token-app.workspace = true
demo-token-client.workspace = true
sails-rs = { workspace = true, features = ["gtest"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[build-dependencies]
demo-token-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app", "client"]

[workspace.package]
version = "0.1.0"
authors = ["Vale Protocol"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/Adityaakr/demo-token"
license = "MIT"
keywords = ["gear", "sails", "smart-contracts", "wasm", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "1.0.1"
tokio = "1.50.0"
demo-token-app = { version = "0.1.0", path = "app" }
demo-token-client = { version = "0.1.0", path = "client" }
